<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title description">
  <title id="title">ArmPath Lite — planar robot arm path checker</title>
  <desc id="description">Concept diagram of a two-link planar arm and its reachable annulus, with a rectangular waypoint path. This is an illustration, not a screenshot.</desc>
  <defs>
    <pattern id="grid" width="32.5" height="32.5" patternUnits="userSpaceOnUse"><path d="M 32.5 0 H 0 V 32.5" fill="none" stroke="#dfe7da" stroke-width="0.7"/></pattern>
  </defs>
  <rect width="1200" height="410" rx="18" fill="#f4f6ef"/>
  <rect x="1" y="1" width="1198" height="408" rx="17" fill="none" stroke="#dce5d6"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="45" y="46" width="37" height="37" rx="10" fill="#20624e"/>
    <path d="M 54 73 L 61 56 L 73 64" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="73" fill="#233c34" font-size="25" font-weight="700">ArmPath Lite</text>
    <text x="47" y="144" fill="#233c34" font-size="38" font-weight="600">Check the path.</text>
    <text x="47" y="191" fill="#233c34" font-size="38" font-weight="600">Explore the motion<tspan fill="#c7784c">.</tspan></text>
    <text x="48" y="230" fill="#6f806e" font-size="15">A small, offline tool for planar 2R robot arms.</text>
    <g fill="#4e6b50" font-size="14">
      <text x="48" y="274">01  Continuous reachability checks</text>
      <text x="48" y="301">02  Both inverse kinematics branches</text>
      <text x="48" y="328">03  Path playback + CSV export</text>
    </g>
    <text x="48" y="377" fill="#86917f" font-family="Consolas,monospace" font-size="11">VANILLA JS / ZERO DEPENDENCIES / MIT</text>
  </g>
  <rect x="620" y="23" width="557" height="364" rx="12" fill="#fbfcf8" stroke="#e1e8db"/>
  <circle cx="905" cy="211" r="156" fill="#eaf1e4"/>
  <circle cx="905" cy="211" r="26" fill="#fbfcf8"/>
  <rect x="634" y="37" width="529" height="336" rx="6" fill="url(#grid)"/>
  <path d="M 640 211 H 1158 M 905 40 V 375" stroke="#c6d3bf"/>
  <circle cx="905" cy="211" r="156" fill="none" stroke="#b5c8a9" stroke-dasharray="4 5"/>
  <circle cx="905" cy="211" r="26" fill="none" stroke="#cdbba1" stroke-dasharray="3 4"/>
  <path d="M 970 181.75 H 1015.5 V 136.25 H 970 Z" fill="none" stroke="#8ba47d" stroke-width="2"/>
  <g fill="#fbfcf8" stroke="#849e76" stroke-width="1.5"><circle cx="970" cy="181.75" r="3"/><circle cx="1015.5" cy="181.75" r="3"/><circle cx="1015.5" cy="136.25" r="3"/><circle cx="970" cy="136.25" r="3"/></g>
  <path d="M 905 211 L 995.91 214.44" stroke="#234f40" stroke-width="13" stroke-linecap="round"/>
  <path d="M 995.91 214.44 L 999.25 149.25" stroke="#81a18a" stroke-width="11" stroke-linecap="round"/>
  <circle cx="905" cy="211" r="11" fill="white" stroke="#234f40" stroke-width="4"/>
  <circle cx="905" cy="211" r="3" fill="#234f40"/>
  <circle cx="995.91" cy="214.44" r="9" fill="white" stroke="#234f40" stroke-width="3"/>
  <circle cx="995.91" cy="214.44" r="3" fill="#234f40"/>
  <circle cx="999.25" cy="149.25" r="13" fill="#d58a5b25"/>
