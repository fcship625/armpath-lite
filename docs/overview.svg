  <path d="M 981 149.25 H 987 M 1011 149.25 H 1017 M 999.25 131 V 137 M 999.25 161 V 167" stroke="#c7784c"/>
  <g font-family="Consolas,monospace" font-size="11" fill="#7a8c70">
    <text x="643" y="61">XY PLANE / CONCEPT DIAGRAM</text>
    <text x="938" y="197">L1</text><text x="1011" y="202">L2</text>
    <text x="1090" y="229">+X</text><text x="915" y="65">+Y</text>
    <text x="643" y="366">R = |L1 - L2| ... L1 + L2</text>
